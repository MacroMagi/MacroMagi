name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libx11-dev libxi-dev libxtst-dev libxcb1-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev libegl-dev libdbus-1-dev libpipewire-0.3-dev libudev-dev
      # rust-toolchain.toml selects the toolchain and its components.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libx11-dev libxi-dev libxtst-dev libxcb1-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev libegl-dev libdbus-1-dev libpipewire-0.3-dev libudev-dev
      # The cross-engine tests run each scenario on the Python engine too when
      # an interpreter is available, so make sure one is.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p magi-app
      - name: Block reference is up to date
        if: runner.os == 'Linux'
        run: |
          ./target/release/macromagi nodes | python tools/node_docs.py > /tmp/NODES.md
          diff -u docs/NODES.md /tmp/NODES.md
