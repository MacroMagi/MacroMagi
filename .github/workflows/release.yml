name: Release

# Builds the portable packages for Windows, Linux and macOS and publishes them
# as a GitHub release – but only when every build succeeds. If any platform
# fails, nothing is published.
#
# Start it by pushing a version tag:
#
#     git tag v0.2.0
#     git push origin v0.2.0
#
# or from the Actions tab (Run workflow), naming the tag to create or use.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. v0.2.0 (created from the selected branch if it does not exist)"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # The Python bundled with the Windows package. Keep it the same as
  # PYTHON_VERSION in crates/magi-app/src/components.rs.
  PYTHON_VERSION: "3.13.14"

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failed platform cancels the others: a release is all or nothing.
      fail-fast: true
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, binary: macromagi.exe }
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, binary: macromagi }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, binary: macromagi }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin, binary: macromagi }
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libx11-dev libxi-dev libxtst-dev libxcb1-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev libegl-dev libdbus-1-dev libpipewire-0.3-dev libudev-dev libasound2-dev

      # rust-toolchain.toml selects the compiler; add the target being built.
      - name: Set up Rust
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p magi-app --target ${{ matrix.target }}

      # A package is the executable plus the documents a user should have.
      # MacroMagi creates its own `data` folder next to the executable on first run.
      # The Windows package also carries Python in a `python` folder, so the Python
      # engine works without installing anything; the app prefers it automatically.
      - name: Package
        shell: bash
        run: |
          package="MacroMagi-${TAG}-${{ matrix.name }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" README.md CHANGELOG.md TERMS.md "dist/$package/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -fsSL -o python.zip "https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-embed-amd64.zip"
            7z x python.zip -o"dist/$package/python" > /dev/null
            rm python.zip
            # Let it find packages installed into it later (such as PyTorch).
            for pth in "dist/$package/python/"*._pth; do
              sed -i 's/^#import site/import site/' "$pth"
              grep -qF 'Lib\site-packages' "$pth" || printf 'Lib\\site-packages\n' >> "$pth"
            done
            test -f "dist/$package/python/python.exe"
          fi
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$package.zip" "$package" > /dev/null
          else
            chmod +x "$package/${{ matrix.binary }}"
            tar -czf "$package.tar.gz" "$package"
          fi
          rm -rf "$package"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    # Runs only if every build above succeeded.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: MacroMagi ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
