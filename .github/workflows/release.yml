name: Release

# Builds the portable packages when a version tag (v0.1.0, …) is pushed and
# attaches them to a draft release for a maintainer to review and publish.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, binary: macromagi.exe }
          - { name: linux-x64, os: ubuntu-latest, binary: macromagi }
          - { name: macos-arm64, os: macos-latest, binary: macromagi }
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libx11-dev libxi-dev libxtst-dev libxcb1-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev libegl-dev libdbus-1-dev libpipewire-0.3-dev libudev-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p magi-app

      # A package is the executable plus the documents a user should have.
      # MacroMagi creates its own `data` folder next to the executable on first run.
      - name: Assemble the package
        shell: bash
        run: |
          package="MacroMagi-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist/$package"
          cp "target/release/${{ matrix.binary }}" README.md CHANGELOG.md "dist/$package/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$package.zip" "$package"
          else
            tar -czf "$package.tar.gz" "$package"
          fi

      - name: Attach to a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.zip
            dist/*.tar.gz
