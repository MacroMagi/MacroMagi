[package]
name = "magi-platform"
description = "MacroMagi operating-system layer: input injection, global input listening, gamepads, and screen capture."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
magi-core.workspace = true
enigo.workspace = true
gilrs.workspace = true
xcap.workspace = true
# The clipboard, without image support (only text is read).
arboard = { version = "3", default-features = false }
# Sound input, for the sound blocks (loopback of what is playing, or a microphone).
cpal = "0.16"

# Windows listens through its own low-level hooks (see src/listen/windows.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Text recognition (Windows.Media.Ocr). The same version screen capture uses.
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

# Everything else listens through rdev.
[target.'cfg(not(windows))'.dependencies]
rdev = "0.5"

[dev-dependencies]
# The system tests inject input "as the user" (without MacroMagi's marker).
enigo.workspace = true
# To decode the picture the text recognition test reads.
magi-vision.workspace = true

[lints]
workspace = true
